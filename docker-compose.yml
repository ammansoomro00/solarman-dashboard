services:
  db:
    image: postgres:16-alpine
    container_name: solarman-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solar}
      POSTGRES_DB: ${POSTGRES_DB:-solar}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - solar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  solar-db:
